<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Regression Tracker</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1c1c22;
      --accent: #e85d75;
      --text: #f0f0f5;
      --muted: #8a8a9a;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    /* Status bar mock */
    .status-bar {
      height: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    /* Header */
    header {
      padding: 8px 20px 16px;
      text-align: center;
    }

    .age-label {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .age-value {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.1;
      margin: 4px 0;
      color: var(--accent);
    }

    .age-sub {
      font-size: 14px;
      color: var(--muted);
    }

    /* Main photo area */
    .photo-area {
      flex: 1;
      margin: 0 16px;
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 380px;
    }

    .photo-placeholder {
      flex: 1;
      background: linear-gradient(145deg, #2a2a32, #1a1a20);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
      padding: 20px;
    }

    .caption {
      padding: 16px 18px;
      background: #16161c;
      font-size: 15px;
      line-height: 1.45;
      border-top: 1px solid #2a2a32;
    }

    .caption strong {
      color: var(--accent);
    }

    /* Action button */
    .action-bar {
      padding: 20px 16px 12px;
    }

    .log-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .log-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .points {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    /* Caregiver tray */
    .tray {
      padding: 12px 16px 28px;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tray::-webkit-scrollbar {
      display: none;
    }

    .caregiver {
      flex-shrink: 0;
      text-align: center;
      width: 64px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2a2a32;
      border: 2px solid #3a3a44;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin: 0 auto 6px;
      position: relative;
    }

    .avatar.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 93, 117, 0.25);
    }

    .avatar.locked {
      opacity: 0.4;
      filter: grayscale(1);
    }

    .name {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .name.active {
      color: var(--text);
      font-weight: 500;
    }

    /* Tiny progress dots under age */
    .progress-dots {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2a2a32;
    }

    .dot.filled {
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <span>Regression</span>
    <span>100%</span>
  </div>

  <header>
    <div class="age-label">Current Age</div>
    <div class="age-value" id="ageDisplay">24</div>
    <div class="age-sub" id="ageSub">Still pretending to be a husband</div>
    <div class="progress-dots" id="dots"></div>
  </header>

  <div class="photo-area">
    <div class="photo-placeholder" id="photo">
      Wife is waiting.<br>Log a set to see what she has for you.
    </div>
    <div class="caption" id="caption">
      <strong>Wife:</strong> “Finish your sets like a good boy and maybe I’ll let you nurse later… if you earn it.”
    </div>
  </div>

  <div class="action-bar">
    <button class="log-btn" onclick="logSet()">Log Completed Set</button>
    <div class="points">Points this session: <span id="points">0</span></div>
  </div>

  <div class="tray" id="tray">
    <!-- populated by JS -->
  </div>

  <script>
    // --- State ---
    let currentAge = 24;
    let points = 0;
    let step = 0;

    const caregivers = [
      { name: "Wife", emoji: "💍", unlocked: true, active: true },
      { name: "Ex", emoji: "💔", unlocked: true, active: false },
      { name: "Nurse", emoji: "🩺", unlocked: false, active: false },
      { name: "Gym", emoji: "🏋️", unlocked: false, active: false },
      { name: "Boss", emoji: "💼", unlocked: false, active: false },
      { name: "Stepmom", emoji: "👠", unlocked: false, active: false },
      { name: "E-girl", emoji: "🎮", unlocked: false, active: false },
      { name: "Demon", emoji: "😈", unlocked: false, active: false },
    ];

    const progression = [
      { age: 24, sub: "Still pretending to be a husband", caption: "Wife: “Finish your sets like a good boy and maybe I’ll let you nurse later… if you earn it.”" },
      { age: 18, sub: "Big brother energy fading fast", caption: "Wife: “Look at you sweating. Keep going and I’ll start treating you like the baby you’re becoming.”" },
      { age: 12, sub: "Getting smaller", caption: "Wife: “Aww, is the little boy tired already? Diaper check after this set.”" },
      { age: 7, sub: "Definitely not a husband anymore", caption: "Wife: “Good boy. Sit still while Mommy decides if you’ve earned the breast.”" },
      { age: 4, sub: "Full regression in progress", caption: "Wife: “That’s it. Just a helpless little thing now. Suckle while I ignore you.”" },
      { age: 2, sub: "Almost there…", caption: "Wife: “Almost small enough. Keep working and Mommy might put you back where you belong.”" },
      { age: 1, sub: "Helpless", caption: "Wife: “There we go. No more big boy. Just a needy little mouth on my tit all day.”" },
      { age: 0, sub: "Back where you started", caption: "Wife: “Climb in. You’re done being outside. Time to become nothing but a fetus again.”" },
    ];

    // --- Render ---
    function render() {
      const p = progression[Math.min(step, progression.length - 1)];
      document.getElementById("ageDisplay").textContent = p.age;
      document.getElementById("ageSub").textContent = p.sub;
      document.getElementById("caption").innerHTML = `<strong>Wife:</strong> “${p.caption.replace(/^Wife: “|”$/g, "")}”`;
      document.getElementById("points").textContent = points;

      // dots
      const dots = document.getElementById("dots");
      dots.innerHTML = "";
      for (let i = 0; i < progression.length; i++) {
        const d = document.createElement("div");
        d.className = "dot" + (i <= step ? " filled" : "");
        dots.appendChild(d);
      }

      // tray
      const tray = document.getElementById("tray");
      tray.innerHTML = "";
      caregivers.forEach(c => {
        const el = document.createElement("div");
        el.className = "caregiver";
        el.innerHTML = `
          <div class="avatar ${c.active ? "active" : ""} ${c.unlocked ? "" : "locked"}">${c.emoji}</div>
          <div class="name ${c.active ? "active" : ""}">${c.name}</div>
        `;
        tray.appendChild(el);
      });
    }

    function logSet() {
      points += 10;
      if (step < progression.length - 1) {
        step++;
        currentAge = progression[step].age;
      }
      // simple unlock example
      if (points >= 30) caregivers[2].unlocked = true;
      if (points >= 50) caregivers[3].unlocked = true;
      if (points >= 70) caregivers[4].unlocked = true;

      render();
    }

    // init
    render();
  </script>
</body>
</html>
