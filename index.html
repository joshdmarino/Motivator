<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Regression Matches</title>
  <style>
    :root {
      --bg: #0b0b0e;
      --card: #16161a;
      --accent: #e11d48;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #27272a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .top {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .top h1 { font-size: 17px; font-weight: 600; }
    .top-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 4px;
      min-width: 50px;
    }
    .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
    .view.active { display: flex; }

    /* Discover */
    #discoverView { padding: 12px 16px 20px; justify-content: space-between; }
    .card-stack {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
    }
    .tinder-card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    .tinder-photo {
      height: 400px;
      background: #111;
      position: relative;
      overflow: hidden;
    }
    .tinder-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tinder-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 50px 16px 18px;
      background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.4) 70%, transparent);
    }
    .tinder-name { font-size: 26px; font-weight: 700; }
    .tinder-name span { font-weight: 500; font-size: 22px; opacity: 0.9; }
    .tinder-bio { margin-top: 6px; font-size: 14.5px; color: #e4e4e7; line-height: 1.35; }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .swipe-actions {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 18px 0 8px;
    }
    .swipe-btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: 26px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .swipe-btn.no { color: #f87171; border-color: #7f1d1d; }
    .swipe-btn.yes { color: #4ade80; border-color: #166534; }

    /* Scene */
    .scene-header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .scene-header img {
      width: 44px; height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }
    .scene-header .name { font-weight: 600; font-size: 15px; }
    .scene-header .sub { font-size: 12px; color: var(--muted); }
    .scene-media {
      width: 100%;
      background: #0f0f12;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scene-media img, .scene-media video {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      background: #000;
    }
    .scene-caption {
      padding: 14px 16px;
      font-size: 14.5px;
      line-height: 1.45;
      border-bottom: 1px solid var(--border);
    }
    .scene-actions { padding: 16px; }
    .primary-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 15.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .secondary-btn {
      width: 100%;
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      cursor: pointer;
    }
    .progress {
      text-align: center;
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--muted);
    }

    /* Dashboard */
    #dashView { padding: 12px 14px 30px; }
    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .dash-card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .dash-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #111;
      display: block;
    }
    .dash-card .info { padding: 10px; }
    .dash-card .name { font-weight: 600; font-size: 14px; }
    .dash-card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Add form */
    #addView { padding: 12px 16px 40px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 500;
    }
    .field input, .field textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 15px;
    }
    .field textarea { min-height: 72px; resize: vertical; }
    .media-list { margin: 8px 0 12px; }
    .media-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .small-btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1a1a1f;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    /* Bottom nav */
    .bottom-nav {
      display: flex;
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 6px 0 10px;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span { display: block; font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="top">
    <button class="top-btn" id="topLeftBtn" onclick="handleTopLeft()"></button>
    <h1 id="topTitle">Discover</h1>
    <button class="top-btn" id="topRightBtn" onclick="showAdd()">Add</button>
  </div>

  <!-- DISCOVER -->
  <div id="discoverView" class="view active">
    <div class="card-stack" id="cardStack">
      <div class="empty-state">
        No characters yet.<br><br>
        Tap <strong>Add</strong> to create your first woman.<br>
        Then come back and swipe.
      </div>
    </div>
    <div class="swipe-actions" id="swipeActions" style="display:none;">
      <button class="swipe-btn no" onclick="swipe(false)">✕</button>
      <button class="swipe-btn yes" onclick="swipe(true)">♥</button>
    </div>
  </div>

  <!-- SCENE -->
  <div id="sceneView" class="view">
    <div class="scene-header">
      <img id="sceneAvatar" src="" alt="">
      <div>
        <div class="name" id="sceneName">—</div>
        <div class="sub" id="sceneSub">—</div>
      </div>
    </div>
    <div class="scene-media" id="sceneMedia"></div>
    <div class="scene-caption" id="sceneCaption"></div>
    <div class="scene-actions">
      <button class="primary-btn" id="unlockBtn" onclick="unlockNext()">Log Workout – Unlock Next</button>
      <button class="secondary-btn" onclick="showDiscover()">Back to Discover</button>
      <div class="progress" id="sceneProgress"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="view">
    <div id="dashContent">
      <div class="empty-state">No matches yet.<br>Swipe right on someone to start.</div>
    </div>
  </div>

  <!-- ADD -->
  <div id="addView" class="view">
    <div class="field">
      <label>Name</label>
      <input type="text" id="addName" placeholder="e.g. Nancy" />
    </div>
    <div class="field">
      <label>Her Age (shown on card)</label>
      <input type="number" id="addAge" placeholder="35" min="18" max="99" />
    </div>
    <div class="field">
      <label>Desire / Bio line</label>
      <textarea id="addBio" placeholder="Looking for a newborn to keep latched all day"></textarea>
    </div>
    <div class="field">
      <label>Profile Photo (big card image)</label>
      <input type="file" id="addProfile" accept="image/*" />
    </div>

    <div style="font-size:13px; color:var(--muted); margin:16px 0 6px;">Extra media (unlocked with workouts)</div>
    <div class="media-list" id="addMediaList"></div>
    <button class="small-btn" onclick="addMediaField()">+ Add Photo or Video</button>

    <button class="primary-btn" style="margin-top:24px;" onclick="saveCharacter()">Save Character</button>
    <button class="secondary-btn" onclick="showDiscover()">Cancel</button>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" id="navDiscover" onclick="showDiscover()">
      <span>♡</span>Discover
    </button>
    <button class="nav-item" id="navDash" onclick="showDash()">
      <span>■</span>Matches
    </button>
  </div>

  <script>
    let characters = [];
    let currentIndex = 0;
    let activeId = null;
    let tempMedia = [];

    function load() {
      const raw = localStorage.getItem("reg_tinder_v1");
      characters = raw ? JSON.parse(raw) : [];
    }
    function save() {
      localStorage.setItem("reg_tinder_v1", JSON.stringify(characters));
    }

    function hideAll() {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    }

    function showDiscover() {
      hideAll();
      document.getElementById("discoverView").classList.add("active");
      document.getElementById("navDiscover").classList.add("active");
      document.getElementById("topTitle").textContent = "Discover";
      document.getElementById("topLeftBtn").textContent = "";
      document.getElementById("topRightBtn").textContent = "Add";
      renderDiscover();
    }

    function showDash() {
      hideAll();
      document.getElementById("dashView").classList.add("active");
      document.getElementById("navDash").classList.add("active");
      document.getElementById("topTitle").textContent = "Matches";
      document.getElementById("topLeftBtn").textContent = "";
      document.getElementById("topRightBtn").textContent = "Add";
      renderDash();
    }

    function showAdd() {
      hideAll();
      document.getElementById("addView").classList.add("active");
      document.getElementById("topTitle").textContent = "New Character";
      document.getElementById("topLeftBtn").textContent = "Cancel";
      document.getElementById("topRightBtn").textContent = "";
      document.getElementById("addName").value = "";
      document.getElementById("addAge").value = "";
      document.getElementById("addBio").value = "";
      document.getElementById("addProfile").value = "";
      tempMedia = [];
      renderTempMedia();
    }

    function showScene(id) {
      activeId = id;
      hideAll();
      document.getElementById("sceneView").classList.add("active");
      document.getElementById("topTitle").textContent = "Scene";
      document.getElementById("topLeftBtn").textContent = "←";
      document.getElementById("topRightBtn").textContent = "";
      renderScene();
    }

    function handleTopLeft() {
      const title = document.getElementById("topTitle").textContent;
      if (title === "New Character" || title === "Scene") showDiscover();
    }

    function getUnmatched() {
      return characters.filter(c => !c.matched);
    }

    function renderDiscover() {
      const stack = document.getElementById("cardStack");
      const actions = document.getElementById("swipeActions");
      const unmatched = getUnmatched();

      if (unmatched.length === 0) {
        stack.innerHTML = `<div class="empty-state">
          ${characters.length === 0 
            ? "No characters yet.<br><br>Tap <strong>Add</strong> to create your first woman."
            : "No more new women right now.<br><br>Add more or check your Matches."}
        </div>`;
        actions.style.display = "none";
        return;
      }

      if (currentIndex >= unmatched.length) currentIndex = 0;
      const c = unmatched[currentIndex];

      stack.innerHTML = `
        <div class="tinder-card">
          <div class="tinder-photo">
            ${c.profile 
              ? `<img src="${c.profile}" alt="">` 
              : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);">No photo</div>`}
            <div class="tinder-info">
              <div class="tinder-name">${c.name} <span>${c.age}</span></div>
              <div class="tinder-bio">${c.bio || ""}</div>
            </div>
          </div>
        </div>`;
      actions.style.display = "flex";
    }

    function swipe(right) {
      const unmatched = getUnmatched();
      if (unmatched.length === 0) return;
      const c = unmatched[currentIndex];

      if (right) {
        c.matched = true;
        c.unlocked = 1;
        save();
        showScene(c.id);
      } else {
        currentIndex = (currentIndex + 1) % unmatched.length;
        renderDiscover();
      }
    }

    function renderScene() {
      const c = characters.find(x => x.id === activeId);
      if (!c) return;

      document.getElementById("sceneAvatar").src = c.profile || "";
      document.getElementById("sceneName").textContent = `${c.name}, ${c.age}`;
      document.getElementById("sceneSub").textContent = c.bio || "";

      const mediaEl = document.getElementById("sceneMedia");
      const captionEl = document.getElementById("sceneCaption");
      const progressEl = document.getElementById("sceneProgress");
      const unlockBtn = document.getElementById("unlockBtn");

      const idx = Math.max(0, (c.unlocked || 1) - 1);
      const item = c.media[idx];

      if (!item || !item.data) {
        mediaEl.innerHTML = `<div style="color:var(--muted);padding:40px;text-align:center;">No media yet.</div>`;
        captionEl.textContent = "";
        unlockBtn.style.display = "none";
        progressEl.textContent = "";
        return;
      }

      if (item.type === "video") {
        mediaEl.innerHTML = `<video src="${item.data}" controls playsinline style="width:100%;max-height:480px;"></video>`;
      } else {
        mediaEl.innerHTML = `<img src="${item.data}" alt="">`;
      }
      captionEl.textContent = item.caption || "";

      const total = c.media.length;
      const unlocked = c.unlocked || 1;
      progressEl.textContent = `${unlocked} / ${total} unlocked`;

      if (unlocked >= total) {
        unlockBtn.textContent = "Fully Unlocked";
        unlockBtn.disabled = true;
        unlockBtn.style.opacity = "0.5";
      } else {
        unlockBtn.textContent = "Log Workout – Unlock Next";
        unlockBtn.disabled = false;
        unlockBtn.style.opacity = "1";
        unlockBtn.style.display = "block";
      }
    }

    function unlockNext() {
      const c = characters.find(x => x.id === activeId);
      if (!c || (c.unlocked || 1) >= c.media.length) return;
      c.unlocked = (c.unlocked || 1) + 1;
      save();
      renderScene();
    }

    function renderDash() {
      const matched = characters.filter(c => c.matched);
      const container = document.getElementById("dashContent");

      if (matched.length === 0) {
        container.innerHTML = `<div class="empty-state">No matches yet.<br>Swipe right on someone to start.</div>`;
        return;
      }

      container.innerHTML = `<div class="dash-grid"></div>`;
      const grid = container.querySelector(".dash-grid");

      matched.forEach(c => {
        const card = document.createElement("div");
        card.className = "dash-card";
        card.onclick = () => showScene(c.id);
        card.innerHTML = `
          ${c.profile ? `<img src="${c.profile}" alt="">` : `<div style="height:160px;background:#111;"></div>`}
          <div class="info">
            <div class="name">${c.name}, ${c.age}</div>
            <div class="sub">${c.unlocked || 1}/${c.media.length} unlocked</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function addMediaField() {
      tempMedia.push({ type: "image", data: null, caption: "" });
      renderTempMedia();
    }

    function renderTempMedia() {
      const list = document.getElementById("addMediaList");
      list.innerHTML = "";
      tempMedia.forEach((m, i) => {
        const div = document.createElement("div");
        div.className = "media-item";
        div.innerHTML = `
          <strong>Media ${i + 1}</strong>
          <input type="text" placeholder="Caption (optional)" 
            value="${m.caption}" 
            onchange="tempMedia[${i}].caption = this.value"
            style="width:100%;margin:6px 0;padding:8px;border-radius:6px;border:1px solid var(--border);background:#1a1a1f;color:var(--text);font-size:13px;" />
          <input type="file" accept="image/*,video/*" onchange="handleTempMedia(event, ${i})" />
        `;
        list.appendChild(div);
      });
    }

    function handleTempMedia(e, index) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        tempMedia[index].data = ev.target.result;
        tempMedia[index].type = file.type.startsWith("video") ? "video" : "image";
      };
      reader.readAsDataURL(file);
    }

    function saveCharacter() {
      const name = document.getElementById("addName").value.trim();
      const age = parseInt(document.getElementById("addAge").value) || 0;
      const bio = document.getElementById("addBio").value.trim();
      const profileInput = document.getElementById("addProfile");

      if (!name) { alert("Name is required"); return; }
      if (age < 18) { alert("Age must be 18+"); return; }

      const finish = (profileData) => {
        const media = tempMedia
          .filter(m => m.data)
          .map(m => ({ type: m.type, data: m.data, caption: m.caption || "" }));

        if (media.length === 0) {
          media.push({ type: "image", data: profileData || null, caption: "" });
        }

        characters.push({
          id: "c" + Date.now(),
          name,
          age,
          bio,
          profile: profileData,
          media,
          matched: false,
          unlocked: 0
        });
        save();
        currentIndex = 0;
        showDiscover();
      };

      if (profileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = ev => finish(ev.target.result);
        reader.readAsDataURL(profileInput.files[0]);
      } else {
        finish(null);
      }
    }

    load();
    showDiscover();
  </script>
</body>
</html>
