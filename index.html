<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SnapMotivate</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --snap-red: #FFFC00;
      --photo-red: #FF2A4B;
      --video-purple: #A033FF;
      --text-gray: #8E8E93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background-color: var(--bg-color); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header { height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
    header h1 { font-size: 22px; font-weight: 800; color: #FFF; letter-spacing: -0.5px; }
    .add-btn { background: #2C2C2E; border: none; color: #FFF; padding: 8px 14px; border-radius: 20px; font-weight: 600; font-size: 14px; cursor: pointer; }

    /* Feed */
    .feed { flex: 1; overflow-y: auto; padding: 8px 0; }
    .snap-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #141414; cursor: pointer; }
    .snap-item:active { background-color: #1A1A1A; }
    
    .icon-box { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-right: 14px; flex-shrink: 0; }
    .icon-box.photo { background-color: var(--photo-red); }
    .icon-box.video { background-color: var(--video-purple); }
    .icon-box.opened { background-color: transparent; border: 2px solid var(--text-gray); }

    .snap-info { flex: 1; }
    .snap-author { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .snap-sub { font-size: 13px; color: var(--text-gray); display: flex; align-items: center; gap: 6px; }

    /* Modal / Popup */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: #1C1C1E; border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; text-align: center; }
    .modal h2 { font-size: 20px; margin-bottom: 8px; }
    .modal p { font-size: 14px; color: var(--text-gray); margin-bottom: 20px; line-height: 1.4; }
    .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: var(--snap-red); color: #000; }
    .btn-secondary { background: #2C2C2E; color: #FFF; }

    /* Upload Form Modal */
    .input-group { text-align: left; margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 4px; text-transform: uppercase; }
    .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 10px; background: #2C2C2E; border: 1px solid #3A3A3C; border-radius: 8px; color: white; font-size: 14px; }

    /* Full Screen Viewer */
    .viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 200; flex-direction: column; }
    .viewer-media { width: 100%; height: 100%; object-fit: cover; }
    .viewer-overlay { position: absolute; top: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%); display: flex; justify-content: space-between; align-items: center; }
    .viewer-caption { position: absolute; bottom: 40px; left: 20px; right: 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 600; text-align: center; line-height: 1.4; }
    
    .timer-bar { position: absolute; top: 10px; left: 10px; right: 10px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
    .timer-progress { height: 100%; background: white; width: 100%; transition: width linear; }
  </style>
</head>
<body>

  <header>
    <h1>Chat</h1>
    <button class="add-btn" onclick="openUploadModal()">+ Add Media</button>
  </header>

  <div class="feed" id="snapFeed">
    <!-- Snaps render here dynamically -->
  </div>

  <!-- Task Confirmation Modal -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h2 id="taskCharName">Unlock Snap</h2>
      <p>Confirm that you completed your task to view this snap.</p>
      <button class="btn btn-primary" onclick="confirmTaskAndOpen()">I Completed My Task! ✅</button>
      <button class="btn btn-secondary" onclick="closeModal('taskModal')">Not Yet</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <h2>Add Character Snap</h2>
      <div class="input-group">
        <label>Character Name</label>
        <input type="text" id="charInput" placeholder="e.g. Mommy Amber">
      </div>
      <div class="input-group">
        <label>Encouraging Message</label>
        <textarea id="msgInput" rows="2" placeholder="e.g. So proud of you! Here's a reward..."></textarea>
      </div>
      <div class="input-group">
        <label>Media File (Photo or Video)</label>
        <input type="file" id="fileInput" accept="image/*,video/*">
      </div>
      <button class="btn btn-primary" onclick="saveMedia()">Save to Pool</button>
      <button class="btn btn-secondary" onclick="closeModal('uploadModal')">Cancel</button>
    </div>
  </div>

  <!-- Fullscreen Viewer -->
  <div class="viewer" id="mediaViewer" onclick="closeViewer()">
    <div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div>
    <div class="viewer-overlay">
      <h3 id="viewerChar" style="font-size: 18px;">Character</h3>
    </div>
    <div id="mediaContainer" style="width:100%; height:100%;"></div>
    <div class="viewer-caption" id="viewerMsg">Message here</div>
  </div>

  <script>
    // IndexedDB Setup for local media storage
    let db;
    const dbReq = indexedDB.open("SnapMotivateDB", 1);
    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore("mediaPool", { keyPath: "id", autoIncrement: true });
    };
    dbReq.onsuccess = (e) => {
      db = e.target.result;
      renderFeed();
    };

    let selectedSnap = null;
    let timerInterval = null;

    function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function saveMedia() {
      const charName = document.getElementById('charInput').value || 'Unknown';
      const message = document.getElementById('msgInput').value || 'Great work!';
      const file = document.getElementById('fileInput').files[0];

      if (!file) return alert('Please select a photo or video!');

      const isVideo = file.type.startsWith('video');
      const transaction = db.transaction(["mediaPool"], "readwrite");
      const store = transaction.objectStore("mediaPool");

      store.add({
        character: charName,
        message: message,
        type: isVideo ? 'video' : 'photo',
        fileData: file,
        opened: false,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      transaction.oncomplete = () => {
        closeModal('uploadModal');
        document.getElementById('charInput').value = '';
        document.getElementById('msgInput').value = '';
        document.getElementById('fileInput').value = '';
        renderFeed();
      };
    }

    function renderFeed() {
      const feed = document.getElementById('snapFeed');
      feed.innerHTML = '';

      const transaction = db.transaction(["mediaPool"], "readonly");
      const store = transaction.objectStore("mediaPool");
      const req = store.getAll();

      req.onsuccess = () => {
        const items = req.result;
        if (items.length === 0) {
          feed.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-gray);">No snaps yet! Tap <b>+ Add Media</b> to upload photos or videos.</div>`;
          return;
        }

        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'snap-item';
          const isPhoto = item.type === 'photo';
          
          div.innerHTML = `
            <div class="icon-box ${item.opened ? 'opened' : (isPhoto ? 'photo' : 'video')}">
              ${isPhoto 
                ? `<svg width="20" height="20" fill="${item.opened ? '#8E8E93' : '#FFF'}" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4v10h16V8H4zm4 3l3 4 2-2.5 3 3.5H6l2-5z"/></svg>`
                : `<svg width="20" height="20" fill="${item.opened ? '#8E8E93' : '#FFF'}" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>`
              }
            </div>
            <div class="snap-info">
              <div class="snap-author">${item.character}</div>
              <div class="snap-sub">
                <span>${item.opened ? 'Opened' : `New ${isPhoto ? 'Snap' : 'Video'}`}</span> • <span>${item.timestamp}</span>
              </div>
            </div>
          `;

          div.onclick = () => handleSnapClick(item);
          feed.appendChild(div);
        });
      };
    }

    function handleSnapClick(item) {
      selectedSnap = item;
      if (item.opened) {
        openViewer(item);
      } else {
        document.getElementById('taskCharName').innerText = `Snap from ${item.character}`;
        document.getElementById('taskModal').style.display = 'flex';
      }
    }

    function confirmTaskAndOpen() {
      closeModal('taskModal');
      
      // Update opened status in IndexedDB
      const transaction = db.transaction(["mediaPool"], "readwrite");
      const store = transaction.objectStore("mediaPool");
      selectedSnap.opened = true;
      store.put(selectedSnap);

      transaction.oncomplete = () => {
        renderFeed();
        openViewer(selectedSnap);
      };
    }

    function openViewer(item) {
      const viewer = document.getElementById('mediaViewer');
      const container = document.getElementById('mediaContainer');
      const charElem = document.getElementById('viewerChar');
      const msgElem = document.getElementById('viewerMsg');
      const progressBar = document.getElementById('timerProgress');

      container.innerHTML = '';
      charElem.innerText = item.character;
      msgElem.innerText = item.message;

      const fileUrl = URL.createObjectURL(item.fileData);

      if (item.type === 'photo') {
        const img = document.createElement('img');
        img.src = fileUrl;
        img.className = 'viewer-media';
        container.appendChild(img);
      } else {
        const video = document.createElement('video');
        video.src = fileUrl;
        video.className = 'viewer-media';
        video.autoplay = true;
        video.playsInline = true;
        container.appendChild(video);
      }

      viewer.style.display = 'flex';

      // 10 second auto-close timer
      let duration = 10000;
      progressBar.style.transition = 'none';
      progressBar.style.width = '100%';
      
      setTimeout(() => {
        progressBar.style.transition = 'width 10s linear';
        progressBar.style.width = '0%';
      }, 50);

      timerInterval = setTimeout(() => {
        closeViewer();
      }, duration);
    }

    function closeViewer() {
      clearTimeout(timerInterval);
      document.getElementById('mediaViewer').style.display = 'none';
      document.getElementById('mediaContainer').innerHTML = '';
    }
  </script>
</body>
</html>
