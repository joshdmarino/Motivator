<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SnapMotivate</title>
  <style>
    :root {
      --bg: #000;
      --card: #1C1C1E;
      --yellow: #FFFC00;
      --red: #FF2A4B;
      --purple: #A033FF;
      --gray: #8E8E93;
      --border: #2C2C2E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    header { height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111; flex-shrink: 0; }
    .counter { background: var(--card); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; font-weight: 800; font-size: 13px; color: var(--yellow); }
    .header-btns { display: flex; gap: 6px; }
    .hbtn { background: var(--card); border: none; color: #fff; padding: 7px 11px; border-radius: 16px; font-size: 12px; font-weight: 600; }

    .main { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; }

    .scenario-card { background: var(--card); border-radius: 20px; padding: 22px 18px; margin-bottom: 24px; border: 1px solid var(--border); }
    .scenario-card.empty { text-align: center; color: var(--gray); padding: 40px 20px; }
    .scenario-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); margin-bottom: 6px; font-weight: 700; }
    .scenario-age { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .scenario-char { font-size: 16px; color: #ddd; margin-bottom: 14px; }
    .progress-text { font-size: 13px; color: var(--gray); }

    .big-btn { width: 100%; padding: 20px; border-radius: 30px; border: none; background: var(--yellow); color: #000; font-size: 18px; font-weight: 800; margin-bottom: 16px; }
    .big-btn:active { transform: scale(0.98); }
    .big-btn:disabled { opacity: 0.4; }

    .secondary-row { display: flex; gap: 10px; }
    .sec-btn { flex: 1; padding: 14px; border-radius: 18px; border: none; background: var(--card); color: #fff; font-size: 13px; font-weight: 600; }

    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(16px); z-index: 100; align-items: flex-end; justify-content: center; }
    .modal.show { display: flex; }
    .sheet { background: var(--card); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 20px 18px 40px; max-height: 92vh; overflow-y: auto; }
    .sheet h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .sheet p { font-size: 13px; color: var(--gray); margin-bottom: 16px; line-height: 1.4; }

    .input-group { margin-bottom: 14px; text-align: left; }
    .input-group label { display: block; font-size: 11px; color: var(--gray); margin-bottom: 5px; font-weight: 700; text-transform: uppercase; }
    input, textarea, select { width: 100%; padding: 12px; background: #2C2C2E; border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
    textarea { min-height: 80px; resize: vertical; }

    .btn { width: 100%; padding: 15px; border-radius: 28px; border: none; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
    .btn-yellow { background: var(--yellow); color: #000; }
    .btn-gray { background: #2C2C2E; color: #fff; }
    .btn-red { background: #3a1515; color: #ff6b6b; }

    .step-card { background: #2C2C2E; border-radius: 14px; padding: 14px; margin-bottom: 10px; text-align: left; }
    .step-num { font-size: 11px; color: var(--yellow); font-weight: 800; margin-bottom: 4px; }
    .step-guide { font-size: 14px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
    .step-file { font-size: 12px; color: var(--gray); }

    .autocomplete-list { background: #2C2C2E; border-radius: 12px; max-height: 180px; overflow-y: auto; margin-top: 4px; display: none; }
    .autocomplete-item { padding: 12px 14px; border-bottom: 1px solid #333; font-size: 14px; }
    .autocomplete-item:active { background: #3a3a3c; }

    /* Viewer */
    .viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 200; flex-direction: column; }
    .viewer.show { display: flex; }
    .viewer-media { width: 100%; height: 100%; object-fit: contain; }
    .viewer-top { position: absolute; top: 0; left: 0; right: 0; padding: 50px 16px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); display: flex; align-items: center; gap: 10px; }
    .viewer-caption { position: absolute; bottom: 40px; left: 14px; right: 14px; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); padding: 14px 16px; border-radius: 18px; font-size: 15px; font-weight: 600; text-align: center; line-height: 1.4; }
    .timer-bar { position: absolute; top: 12px; left: 12px; right: 12px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; z-index: 210; }
    .timer-progress { height: 100%; background: #fff; width: 100%; transition: width 0.1s linear; }

    .avatar-box { width: 42px; height: 42px; border-radius: 50%; background: #222; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<header>
  <div class="counter">✅ <span id="taskCount">0</span></div>
  <div class="header-btns">
    <button class="hbtn" onclick="openBuilder()">Build Story</button>
    <button class="hbtn" onclick="openRoster()">Roster</button>
    <button class="hbtn" onclick="doReset()">Reset</button>
  </div>
</header>

<div class="main">
  <div class="scenario-card" id="scenarioCard">
    <div class="empty" id="emptyState">
      <div style="font-size:15px; margin-bottom:8px;">No active scenario</div>
      <div style="font-size:13px;">Complete a task to start a random story</div>
    </div>
    <div id="activeState" style="display:none;">
      <div class="scenario-label">Current Scenario</div>
      <div class="scenario-age" id="dispAge">—</div>
      <div class="scenario-char" id="dispChar">—</div>
      <div class="progress-text" id="dispProgress">—</div>
    </div>
  </div>

  <button class="big-btn" id="mainBtn" onclick="completeTask()">I Completed a Task ✅</button>

  <div class="secondary-row">
    <button class="sec-btn" onclick="openBuilder()">+ Add / Build Story</button>
  </div>
</div>

<!-- STORY BUILDER -->
<div class="modal" id="builderModal">
  <div class="sheet">
    <h2>Build Story</h2>
    <p>Search a character → Generate a unique story → Upload matching photos/videos in order.</p>

    <div class="input-group">
      <label>Character</label>
      <input type="text" id="charSearch" placeholder="Start typing name..." autocomplete="off" oninput="filterChars()">
      <div class="autocomplete-list" id="autoList"></div>
    </div>

    <div id="selectedCharBox" style="display:none; margin-bottom:14px; padding:10px; background:#2C2C2E; border-radius:12px; font-size:14px;"></div>

    <button class="btn btn-yellow" id="genBtn" style="display:none;" onclick="generateStory()">Generate Unique Story</button>

    <div id="storySteps" style="display:none; margin-top:16px;"></div>

    <div id="uploadZone" style="display:none; margin-top:12px;">
      <div class="input-group">
        <label>Select photos/videos in order (same order as steps)</label>
        <input type="file" id="multiFiles" accept="image/*,video/*" multiple>
      </div>
      <button class="btn btn-yellow" onclick="saveGeneratedStory()">Save Full Story</button>
    </div>

    <button class="btn btn-gray" onclick="closeModal('builderModal')">Close</button>
  </div>
</div>

<!-- ROSTER -->
<div class="modal" id="rosterModal">
  <div class="sheet">
    <h2>Character Roster</h2>
    <p style="font-size:12px;">All characters are 18+ adults (labels are roleplay only).</p>
    <div id="rosterList" style="max-height:60vh; overflow-y:auto; text-align:left;"></div>
    <button class="btn btn-gray" onclick="closeModal('rosterModal')" style="margin-top:16px;">Close</button>
  </div>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer()">
  <div class="timer-bar"><div class="timer-progress" id="timerBar"></div></div>
  <div class="viewer-top">
    <div class="avatar-box" id="viewerAvatar"></div>
    <div>
      <div id="viewerName" style="font-weight:700; font-size:16px;"></div>
      <div id="viewerAge" style="font-size:12px; color:#aaa;"></div>
    </div>
  </div>
  <div id="mediaBox" style="flex:1; display:flex; align-items:center; justify-content:center;"></div>
  <div class="viewer-caption" id="viewerCaption"></div>
</div>

<script>
// ================= DATA =================
const CHARACTERS = [
  "Ex girlfriend","First crush","Work crush","Step sister","Demon","E girl",
  "Average mommy","Hot mommy","Gym crush","Bimbo mommy","Scientist","Only fans model",
  "Foreign gold digger","Little neighbor","Hot highschooler","90s babysitter","90s model",
  "Cartoon mommy","Cartoon babysitter","Goth mommy","Average girlfriend","Mixed girlfriend",
  "Early 30s girlfriend","Average highschooler","New mom","Preteen babysitter","Fat mommy",
  "Big sister","Little sister","Nurse","Mormon","Ex girlfriend cousin / cheerleader",
  "Barista","Young teacher","Mommy content of creator","Yoga instructor","Single mom",
  "Lesbian","Alt mommy","Divorcee","Asian mommy","Latina mommy","Middle eastern mommy",
  "Suburban mommy","Tiny boobed mommy","Indie mommy","Trailer park mommy","Rich mommy",
  "Jewish mommy","Braces","Nanny","Boss","Young Stepmom","Waitress","Exs mom",
  "Pierced mommy","Hippie mommy","Daughter","Kindergartner","Teen mom","Lifeguard","Youth group"
];

const AGES = ["Newborn","1 year old","2 years old","Toddler","3 years old","4 years old","Heavily regressed","Fully dependent","Infant","Very needy toddler"];

const SKINS = ["#F3D3BD","#E0B090","#D08B5B","#A05A2C","#76390B"];
const HAIRS = ["long","bob","bun"];
const HCOLORS = ["#1F1610","#3D2314","#C48E48","#7D1E1E","#A832A4","#222"];

// Story step pools (guide = what user should upload, caption = real snap text)
const STEP_POOLS = [
  {
    guide: "Clothed, looking down at you with a bored/annoyed face",
    captions: [
      "task done. you're mine now. stay quiet.",
      "congrats i guess. you're a baby and i'm stuck with you.",
      "don't make this weird. just sit there."
    ]
  },
  {
    guide: "Soft breast close-up, offering nipple, looking slightly down",
    captions: [
      "open. latch. now.",
      "this is all you're getting. suck.",
      "good boy. keep your eyes down."
    ]
  },
  {
    guide: "Nursing angle – breast in mouth, her face half visible, phone in other hand",
    captions: [
      "keep sucking while i ignore you.",
      "you're lucky i even let you have this.",
      "quiet. mommy's busy."
    ]
  },
  {
    guide: "Diaper change from above – looking down between your legs",
    captions: [
      "gross. hold still.",
      "you're such a mess. again.",
      "don't squirm or i'll make it worse."
    ]
  },
  {
    guide: "Ass / underboob while leaning over you, soft body visible",
    captions: [
      "stay right there under me.",
      "this is the closest you'll get to being useful.",
      "look at you. pathetic."
    ]
  },
  {
    guide: "Armpit or soft belly close-up, casual and dismissive",
    captions: [
      "kiss. now.",
      "you wanted this. do it.",
      "good. stay down there."
    ]
  },
  {
    guide: "POV looking up at her soft chest / face while she looks bored",
    captions: [
      "this is what you are now.",
      "keep staring. it won't change anything.",
      "mommy's not impressed."
    ]
  },
  {
    guide: "Sexy / casual outfit or swimsuit, standing over you",
    captions: [
      "don't get any ideas. you're still just a baby.",
      "nice try looking. you're still in a diaper.",
      "enjoy the view. that's all you get."
    ]
  },
  {
    guide: "Heavy soft body pressing down or sitting near your face",
    captions: [
      "breathe. or don't.",
      "this is your place.",
      "quiet under me."
    ]
  },
  {
    guide: "Close-up of her face looking down with a mean little smile",
    captions: [
      "you're mine until i get bored.",
      "say thank you.",
      "good little thing."
    ]
  }
];

// ================= STATE =================
let db;
let stories = JSON.parse(localStorage.getItem('sm_stories') || '{}'); // charName -> array of {guide, caption, type, fileData, opened}
let totalTasks = parseInt(localStorage.getItem('sm_tasks') || '0');
let activeChar = localStorage.getItem('sm_active') || null;
let currentAge = localStorage.getItem('sm_age') || null;
let currentStep = parseInt(localStorage.getItem('sm_step') || '0');
let selectedChar = null;
let generatedSteps = [];
let timer = null;

// ================= INIT =================
const req = indexedDB.open("SnapMotivate_v5", 1);
req.onupgradeneeded = e => {
  db = e.target.result;
  if (!db.objectStoreNames.contains("media")) {
    db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
  }
};
req.onsuccess = e => {
  db = e.target.result;
  updateUI();
};

function updateUI() {
  document.getElementById('taskCount').textContent = totalTasks;

  const empty = document.getElementById('emptyState');
  const active = document.getElementById('activeState');
  const btn = document.getElementById('mainBtn');

  if (activeChar && stories[activeChar] && stories[activeChar].length > 0) {
    empty.style.display = 'none';
    active.style.display = 'block';
    document.getElementById('dispAge').textContent = currentAge || '—';
    document.getElementById('dispChar').textContent = activeChar;
    const total = stories[activeChar].length;
    const done = stories[activeChar].filter(s => s.opened).length;
    document.getElementById('dispProgress').textContent = `Snap ${done + 1} of ${total}`;
    btn.disabled = false;
  } else {
    empty.style.display = 'block';
    active.style.display = 'none';
    btn.disabled = false;
  }
}

// ================= MAIN TASK FLOW =================
function completeTask() {
  totalTasks++;
  localStorage.setItem('sm_tasks', totalTasks);
  document.getElementById('taskCount').textContent = totalTasks;

  // If we have an active story with remaining snaps
  if (activeChar && stories[activeChar]) {
    const remaining = stories[activeChar].filter(s => !s.opened);
    if (remaining.length > 0) {
      const next = remaining[0];
      next.opened = true;
      localStorage.setItem('sm_stories', JSON.stringify(stories));
      showSnap(activeChar, next);
      updateUI();
      return;
    }
  }

  // Otherwise start a brand new random story
  const readyChars = Object.keys(stories).filter(name => {
    return stories[name].some(s => !s.opened);
  });

  if (readyChars.length === 0) {
    alert("No stories ready.\n\nGo to “Build Story” and create at least one full story first.");
    return;
  }

  // Pick random
  activeChar = readyChars[Math.floor(Math.random() * readyChars.length)];
  currentAge = AGES[Math.floor(Math.random() * AGES.length)];
  currentStep = 0;

  localStorage.setItem('sm_active', activeChar);
  localStorage.setItem('sm_age', currentAge);
  localStorage.setItem('sm_step', 0);

  // Unlock first snap
  const first = stories[activeChar].find(s => !s.opened);
  if (first) {
    first.opened = true;
    localStorage.setItem('sm_stories', JSON.stringify(stories));
    showSnap(activeChar, first);
  }
  updateUI();
}

// ================= VIEWER =================
function showSnap(charName, snap) {
  const viewer = document.getElementById('viewer');
  const mediaBox = document.getElementById('mediaBox');
  mediaBox.innerHTML = '';

  document.getElementById('viewerName').textContent = charName;
  document.getElementById('viewerAge').textContent = currentAge ? `You are a ${currentAge}` : '';
  document.getElementById('viewerCaption').textContent = snap.caption;
  document.getElementById('viewerAvatar').innerHTML = makeAvatar(charName);

  if (snap.fileData) {
    const url = URL.createObjectURL(snap.fileData);
    if (snap.type === 'video') {
      const v = document.createElement('video');
      v.src = url;
      v.className = 'viewer-media';
      v.autoplay = true;
      v.playsInline = true;
      mediaBox.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = url;
      img.className = 'viewer-media';
      mediaBox.appendChild(img);
    }
  } else {
    mediaBox.innerHTML = `<div style="color:#666; font-size:14px;">No media for this step</div>`;
  }

  viewer.classList.add('show');

  // timer
  const bar = document.getElementById('timerBar');
  bar.style.transition = 'none';
  bar.style.width = '100%';
  setTimeout(() => {
    bar.style.transition = 'width 9s linear';
    bar.style.width = '0%';
  }, 40);

  clearTimeout(timer);
  timer = setTimeout(closeViewer, 9000);
}

function closeViewer() {
  clearTimeout(timer);
  document.getElementById('viewer').classList.remove('show');
  document.getElementById('mediaBox').innerHTML = '';
}

// ================= BUILDER =================
function openBuilder() {
  selectedChar = null;
  generatedSteps = [];
  document.getElementById('charSearch').value = '';
  document.getElementById('selectedCharBox').style.display = 'none';
  document.getElementById('genBtn').style.display = 'none';
  document.getElementById('storySteps').style.display = 'none';
  document.getElementById('uploadZone').style.display = 'none';
  document.getElementById('autoList').style.display = 'none';
  document.getElementById('builderModal').classList.add('show');
}

function filterChars() {
  const q = document.getElementById('charSearch').value.toLowerCase().trim();
  const list = document.getElementById('autoList');
  if (!q) { list.style.display = 'none'; return; }

  const matches = CHARACTERS.filter(c => c.toLowerCase().includes(q)).slice(0, 8);
  list.innerHTML = matches.map(c => 
    `<div class="autocomplete-item" onclick="pickChar('${c.replace(/'/g, "\\'")}')">${c}</div>`
  ).join('');
  list.style.display = matches.length ? 'block' : 'none';
}

function pickChar(name) {
  selectedChar = name;
  document.getElementById('charSearch').value = name;
  document.getElementById('autoList').style.display = 'none';
  document.getElementById('selectedCharBox').style.display = 'block';
  document.getElementById('selectedCharBox').textContent = `Selected: ${name}`;
  document.getElementById('genBtn').style.display = 'block';
  document.getElementById('storySteps').style.display = 'none';
  document.getElementById('uploadZone').style.display = 'none';
}

function generateStory() {
  if (!selectedChar) return;

  // Create 5–7 unique steps
  const count = 5 + Math.floor(Math.random() * 3);
  const used = new Set();
  generatedSteps = [];

  while (generatedSteps.length < count) {
    const pool = STEP_POOLS[Math.floor(Math.random() * STEP_POOLS.length)];
    const key = pool.guide;
    if (used.has(key) && generatedSteps.length < STEP_POOLS.length) continue;
    used.add(key);

    const caption = pool.captions[Math.floor(Math.random() * pool.captions.length)];
    generatedSteps.push({
      guide: pool.guide,
      caption: caption,
      type: null,
      fileData: null,
      opened: false
    });
  }

  // Render steps
  const container = document.getElementById('storySteps');
  container.innerHTML = `<div style="font-size:13px; color:var(--gray); margin-bottom:10px;">Upload media that matches each guide (in order):</div>`;
  
  generatedSteps.forEach((s, i) => {
    container.innerHTML += `
      <div class="step-card">
        <div class="step-num">STEP ${i + 1}</div>
        <div class="step-guide">${s.guide}</div>
        <div class="step-file" id="fileLabel${i}">No file yet</div>
      </div>
    `;
  });

  container.style.display = 'block';
  document.getElementById('uploadZone').style.display = 'block';
  document.getElementById('multiFiles').value = '';
}

function saveGeneratedStory() {
  const files = document.getElementById('multiFiles').files;
  if (!files || files.length === 0) {
    return alert("Select the photos/videos first (in the same order as the steps).");
  }

  // Assign files in order
  for (let i = 0; i < generatedSteps.length; i++) {
    if (files[i]) {
      generatedSteps[i].fileData = files[i];
      generatedSteps[i].type = files[i].type.startsWith('video') ? 'video' : 'photo';
    }
  }

  // Save
  stories[selectedChar] = generatedSteps;
  localStorage.setItem('sm_stories', JSON.stringify(stories));

  // Also store actual file blobs in IndexedDB for persistence
  const tx = db.transaction("media", "readwrite");
  const store = tx.objectStore("media");
  // clear old for this char if needed – simple version just keeps in memory + localStorage for now
  // (for full persistence of large files we would store in IDB and keep references)

  alert(`Story saved for ${selectedChar}!\n\n${generatedSteps.length} steps ready.`);
  closeModal('builderModal');
  updateUI();
}

// ================= HELPERS =================
function makeAvatar(name) {
  const idx = CHARACTERS.indexOf(name);
  const skin = SKINS[idx % SKINS.length];
  const style = HAIRS[idx % HAIRS.length];
  const col = HCOLORS[idx % HCOLORS.length];
  let hair = "";
  if (style === "long") hair = `<path d="M12,22 C10,8 38,8 36,22 C38,36 36,48 34,50 C30,50 32,32 30,28 C28,32 26,50 22,50 C18,50 16,36 14,22 Z" fill="${col}"/>`;
  else if (style === "bob") hair = `<path d="M11,20 C10,6 38,6 37,20 C38,28 36,36 32,36 C28,36 30,22 24,20 C18,22 20,36 16,36 C12,36 10,28 11,20 Z" fill="${col}"/>`;
  else hair = `<circle cx="24" cy="7" r="7" fill="${col}"/><path d="M13,20 C12,10 36,10 35,20 C32,16 16,16 13,20 Z" fill="${col}"/>`;

  return `<svg width="40" height="42" viewBox="0 0 48 52">
    ${hair}
    <path d="M18,38 L30,38 L33,52 L15,52 Z" fill="${skin}"/>
    <path d="M15,18 C15,10 33,10 33,18 C33,32 15,32 15,18 Z" fill="${skin}"/>
    <ellipse cx="20" cy="20" rx="1.8" ry="2.2" fill="#222"/>
    <ellipse cx="28" cy="20" rx="1.8" ry="2.2" fill="#222"/>
    <path d="M21,27 Q24,30 27,27 Q24,28 21,27 Z" fill="#E86F68"/>
  </svg>`;
}

function openRoster() {
  const list = document.getElementById('rosterList');
  list.innerHTML = CHARACTERS.map(c => {
    const has = stories[c] ? ` • ${stories[c].length} snaps` : '';
    return `<div style="padding:10px 0; border-bottom:1px solid #2C2C2E; font-size:14px;">${c}<span style="color:var(--gray); font-size:12px;">${has}</span></div>`;
  }).join('');
  document.getElementById('rosterModal').classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function doReset() {
  if (confirm("Erase all stories, progress, and data?")) {
    localStorage.clear();
    indexedDB.deleteDatabase("SnapMotivate_v5");
    location.reload();
  }
}

// Close modals on background tap
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) m.classList.remove('show');
  });
});
</script>
</body>
