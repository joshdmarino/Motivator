    input, select { width: 100%; padding: 12px; background: #2C2C2E; border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }

    .btn-yellow { background: var(--yellow); color: #000; }
    .btn-gray { background: #2C2C2E; color: #fff; }
    .step-card { background: #2C2C2E; border-radius: 14px; padding: 13px; margin-bottom: 9px; text-align: left; }
    .step-num { font-size: 11px; color: var(--yellow); font-weight: 800; margin-bottom: 3px; }

    .viewer-top { position: absolute; top: 0; left: 0; right: 0; padding: 48px 16px 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); display: flex; align-items: center; gap: 10px; }

<header>
  <div class="counter">✅ <span id="taskCount">0</span></div>

    <button class="hbtn" onclick="openBuilder()">Build</button>

    <button class="hbtn" onclick="doReset()">Reset</button>
  </div>

    </div>
    <div id="activeState" style="display:none;">

      <div class="scenario-age" id="dispAge">—</div>
      <div class="scenario-char" id="dispChar">—</div>
      <div class="progress-text" id="dispProgress">—</div>
    </div>
  </div>
  <button class="big-btn" id="mainBtn" onclick="completeTask()">I Completed a Task ✅</button>
  <button class="sec-btn" onclick="openBuilder()">Build / Upload Story</button>
</div>

<!-- BUILDER -->
<div class="modal" id="builderModal">

    <p>Pick a character. You’ll see her fixed 5-step story and exactly what to upload for each step.</p>
    <div class="input-group">

      <input type="text" id="charSearch" placeholder="Start typing..." oninput="filterChars()" autocomplete="off">

    </div>
    <div id="selectedBox" style="display:none;margin-bottom:12px;padding:10px;background:#2C2C2E;border-radius:12px;font-size:14px;"></div>
    <div id="storySteps" style="display:none;"></div>
    <div id="uploadZone" style="display:none;margin-top:12px;">
      <div class="input-group">

        <input type="file" id="multiFiles" accept="image/*,video/*" multiple>
      </div>
      <button class="btn btn-yellow" onclick="saveStory()">Save Story</button>
    </div>
    <button class="btn btn-gray" onclick="closeModal('builderModal')">Close</button>
  </div>
</div>

<!-- ROSTER -->
<div class="modal" id="rosterModal">
  <div class="sheet">

    <div id="rosterList" style="max-height:65vh;overflow-y:auto;text-align:left;font-size:14px;"></div>
    <button class="btn btn-gray" style="margin-top:14px;" onclick="closeModal('rosterModal')">Close</button>
  </div>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer()">

  if (snap.file) {
    const url = URL.createObjectURL(snap.file);

      const v = document.createElement('video');
      v.src = url; v.className = 'viewer-media'; v.autoplay = true; v.playsInline = true;
      box.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = url; img.className = 'viewer-media';
      box.appendChild(img);
    }
  }
  document.getElementById('viewer').classList.add('show');
  const bar = document.getElementById('timerBar');
  bar.style.transition = 'none'; bar.style.width = '100%';
  setTimeout(() => { bar.style.transition = 'width 8s linear'; bar.style.width = '0%'; }, 30);
  clearTimeout(timer);
  timer = setTimeout(closeViewer, 8000);
}

function closeViewer() {

}

function filterChars() {
  const q = document.getElementById('charSearch').value.toLowerCase();
  const list = document.getElementById('autoList');
  if (!q) { list.style.display = 'none'; return; }
  const matches = CHARACTERS.filter(c => c.toLowerCase().includes(q)).slice(0, 8);
  list.innerHTML = matches.map(c => `<div class="autocomplete-item" onclick="pickChar('${c.replace(/'/g,"\\'")}')">${c}</div>`).join('');
  list.style.display = matches.length ? 'block' : 'none';
}

function pickChar(name) {
  selectedChar = name;
  document.getElementById('charSearch').value = name;
  document.getElementById('autoList').style.display = 'none';
  document.getElementById('selectedBox').style.display = 'block';
  document.getElementById('selectedBox').textContent = `Selected: ${name}`;
  
  const steps = STORIES[name] || DEFAULT_STORY;
  const container = document.getElementById('storySteps');
  container.innerHTML = steps.map((s, i) => `
    <div class="step-card">
      <div class="step-num">STEP ${i+1}</div>
      <div class="step-guide">${s.guide}</div>
    </div>
  `).join('');
  container.style.display = 'block';
  document.getElementById('uploadZone').style.display = 'block';
  document.getElementById('multiFiles').value = '';
}

function saveStory() {
  const files = document.getElementById('multiFiles').files;
  if (!files || files.length < 1) return alert("Select the photos/videos first.");
  const base = STORIES[selectedChar] || DEFAULT_STORY;
  const saved = base.map((s, i) => ({
    guide: s.guide,
    caption: s.caption,
    file: files[i] || null,
    type: files[i] ? (files[i].type.startsWith('video') ? 'video' : 'photo') : null,
    opened: false
  }));
  stories[selectedChar] = saved;
  localStorage.setItem('sm_stories', JSON.stringify(stories));
  alert(`Saved ${saved.length}-step story for ${selectedChar}`);
  closeModal('builderModal');
  updateUI();
}

function openRoster() {
  document.getElementById('rosterList').innerHTML = CHARACTERS.map(c => {
    const has = stories[c] ? ` ✓ ${stories[c].length} snaps` : '';
    return `<div style="padding:9px 0;border-bottom:1px solid #2C2C2E;">${c}<span style="color:var(--gray);font-size:12px;">${has}</span></div>`;
  }).join('');
  document.getElementById('rosterModal').classList.add('show');
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function doReset() {
  if (confirm("Erase everything?")) {
    localStorage.clear();
    location.reload();
  }
}

function makeAvatar(name) {
  const i = CHARACTERS.indexOf(name);
  const skin = ["#F3D3BD","#E0B090","#D08B5B","#A05A2C","#76390B"][i % 5];
  const col = ["#1F1610","#3D2314","#C48E48","#7D1E1E","#222"][i % 5];
  return `<svg width="40" height="42" viewBox="0 0 48 52">
    <circle cx="24" cy="8" r="6" fill="${col}"/>
    <path d="M14,20 C13,10 35,10 34,20 C32,16 16,16 14,20 Z" fill="${col}"/>
    <path d="M18,38 L30,38 L33,52 L15,52 Z" fill="${skin}"/>
    <path d="M15,18 C15,10 33,10 33,18 C33,32 15,32 15,18 Z" fill="${skin}"/>
    <ellipse cx="20" cy="20" rx="1.7" ry="2.1" fill="#222"/>
    <ellipse cx="28" cy="20" rx="1.7" ry="2.1" fill="#222"/>
  </svg>`;
}

updateUI();
</script>
