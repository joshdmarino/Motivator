<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SnapMotivate</title>
  <style>
    :root {
      --bg-black: #000000;
      --card-gray: #1C1C1E;
      --snap-yellow: #FFFC00;
      --snap-blue: #0084FF;
      --photo-red: #FF2A4B;
      --video-purple: #A033FF;
      --text-gray: #8E8E93;
      --border-gray: #2C2C2E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background-color: var(--bg-black); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Snapchat Header */
    header { height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-black); border-bottom: 1px solid #121212; }
    header h1 { font-size: 22px; font-weight: 800; color: #FFF; letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: var(--card-gray); border: none; color: #FFF; padding: 8px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    /* Feed */
    .feed { flex: 1; overflow-y: auto; padding: 4px 0; }
    .snap-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #121212; cursor: pointer; }
    .snap-item:active { background-color: #121212; }
    
    /* Bitmoji Avatar */
    .avatar-box { width: 48px; height: 48px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; position: relative; margin-right: 12px; flex-shrink: 0; border: 2px solid transparent; }
    .avatar-svg { width: 32px; height: 32px; }
    
    .snap-type-badge { position: absolute; bottom: -2px; right: -2px; width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-black); }
    .snap-type-badge.photo { background-color: var(--photo-red); }
    .snap-type-badge.video { background-color: var(--video-purple); }
    .snap-type-badge.opened { background-color: transparent; border-color: var(--text-gray); }

    .snap-info { flex: 1; }
    .snap-header-line { display: flex; align-items: center; justify-content: space-between; }
    .snap-author { font-size: 16px; font-weight: 700; color: #FFF; }
    .streak-count { font-size: 13px; color: #FF9500; font-weight: 700; }
    .snap-sub { font-size: 13px; color: var(--text-gray); display: flex; align-items: center; gap: 6px; margin-top: 2px; }

    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--card-gray); border-radius: 24px; padding: 24px; width: 100%; max-width: 350px; text-align: center; border: 1px solid var(--border-gray); }
    .modal h2 { font-size: 20px; margin-bottom: 12px; font-weight: 800; }
    .modal p { font-size: 14px; color: var(--text-gray); margin-bottom: 20px; line-height: 1.4; }
    
    .btn { width: 100%; padding: 14px; border-radius: 30px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 8px; }
    .btn-snap { background: var(--snap-yellow); color: #000; }
    .btn-secondary { background: var(--border-gray); color: #FFF; }

    /* Inputs */
    .input-group { text-align: left; margin-bottom: 14px; }
    .input-group label { display: block; font-size: 11px; color: var(--text-gray); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; tracking: 0.5px; }
    .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 12px; background: #2C2C2E; border: 1px solid var(--border-gray); border-radius: 12px; color: white; font-size: 14px; outline: none; }

    /* Full Screen Viewer */
    .viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 200; flex-direction: column; }
    .viewer-media { width: 100%; height: 100%; object-fit: cover; }
    .viewer-overlay { position: absolute; top: 0; left: 0; right: 0; padding: 24px 20px 20px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%); display: flex; align-items: center; gap: 12px; }
    .viewer-caption-bar { position: absolute; bottom: 50px; left: 16px; right: 16px; background: rgba(0,0,0,0.65); backdrop-filter: blur(10px); padding: 14px 18px; border-radius: 20px; font-size: 15px; font-weight: 600; text-align: center; line-height: 1.4; border: 1px solid rgba(255,255,255,0.1); }
    
    .timer-bar { position: absolute; top: 12px; left: 12px; right: 12px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; z-index: 210; }
    .timer-progress { height: 100%; background: white; width: 100%; }
  </style>
</head>
<body>

  <header>
    <h1>Chat</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="openModal('charModal')">👤 Characters</button>
      <button class="icon-btn" onclick="openUploadModal()">+ Add Snap</button>
    </div>
  </header>

  <div class="feed" id="snapFeed">
    <!-- Dynamic feed -->
  </div>

  <!-- Task Confirmation Modal -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <div id="taskAvatarPreview" style="margin-bottom:12px; display:flex; justify-content:center;"></div>
      <h2 id="taskCharName">Unlock Snap</h2>
      <p>Confirm that you completed your task to reveal this snap.</p>
      <button class="btn btn-snap" onclick="confirmTaskAndOpen()">Complete Task & View ✅</button>
      <button class="btn btn-secondary" onclick="closeModal('taskModal')">Cancel</button>
    </div>
  </div>

  <!-- Character Creation Modal -->
  <div class="modal" id="charModal">
    <div class="modal-content">
      <h2>Character Roster</h2>
      <div id="characterList" style="max-height: 120px; overflow-y: auto; margin-bottom: 16px; text-align: left;"></div>
      
      <h3 style="font-size: 14px; text-align: left; margin-bottom: 8px; color: var(--text-gray);">CREATE NEW CHARACTER</h3>
      <div class="input-group">
        <label>Name</label>
        <input type="text" id="newCharName" placeholder="Enter name...">
      </div>
      <div class="input-group" style="display: flex; gap: 8px;">
        <div style="flex:1;">
          <label>Skin</label>
          <select id="newCharSkin">
            <option value="#FD3">Light</option>
            <option value="#D08B5B">Medium</option>
            <option value="#AE5B2D">Dark</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>Hair Style</label>
          <select id="newCharHairStyle">
            <option value="long">Long</option>
            <option value="short">Short</option>
            <option value="curly">Curly</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>Hair Color</label>
          <select id="newCharHairColor">
            <option value="#2C1608">Dark</option>
            <option value="#B8860B">Blonde</option>
            <option value="#8B0000">Red</option>
            <option value="#4A2E80">Purple</option>
          </select>
        </div>
      </div>
      <button class="btn btn-snap" onclick="createCharacter()">Add Character</button>
      <button class="btn btn-secondary" onclick="closeModal('charModal')">Close</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <h2>Add New Snap</h2>
      <p style="font-size:12px; margin-bottom:12px;">This snap will be randomly sent by one of your characters!</p>
      <div class="input-group">
        <label>Encouraging Message</label>
        <textarea id="msgInput" rows="2" placeholder="Write something motivating..."></textarea>
      </div>
      <div class="input-group">
        <label>Media File (Photo/Video)</label>
        <input type="file" id="fileInput" accept="image/*,video/*">
      </div>
      <button class="btn btn-snap" onclick="saveMedia()">Add to Pool</button>
      <button class="btn btn-secondary" onclick="closeModal('uploadModal')">Cancel</button>
    </div>
  </div>

  <!-- Fullscreen Viewer -->
  <div class="viewer" id="mediaViewer" onclick="closeViewer()">
    <div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div>
    <div class="viewer-overlay">
      <div id="viewerAvatar"></div>
      <h3 id="viewerChar" style="font-size: 18px; font-weight: 700;"></h3>
    </div>
    <div id="mediaContainer" style="width:100%; height:100%;"></div>
    <div class="viewer-caption-bar" id="viewerMsg"></div>
  </div>

  <script>
    let db;
    let characters = JSON.parse(localStorage.getItem('sm_characters') || '[]');
    let selectedSnap = null;
    let timerInterval = null;

    // Database Initialization
    const dbReq = indexedDB.open("SnapMotivateDB_v2", 1);
    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore("mediaPool", { keyPath: "id", autoIncrement: true });
    };
    dbReq.onsuccess = (e) => {
      db = e.target.result;
      renderFeed();
    };

    function openModal(id) { 
      if(id === 'charModal') renderCharacterList();
      document.getElementById(id).style.display = 'flex'; 
    }
    function openUploadModal() {
      if(characters.length === 0) return alert('Please create at least one character first!');
      openModal('uploadModal');
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Bitmoji SVG Generator
    function generateBitmojiSVG(skin, style, hairColor) {
      let hairPath = "";
      if(style === 'long') hairPath = `<path d="M 8,16 Q 20,2 32,16 Q 36,28 34,34 Q 20,32 6,34 Z" fill="${hairColor}"/>`;
      else if(style === 'curly') hairPath = `<circle cx="20" cy="10" r="12" fill="${hairColor}"/><circle cx="12" cy="14" r="8" fill="${hairColor}"/><circle cx="28" cy="14" r="8" fill="${hairColor}"/>`;
      else hairPath = `<path d="M 10,16 Q 20,6 30,16 Q 28,10 20,8 Q 12,10 10,16 Z" fill="${hairColor}"/>`;

      return `
        <svg class="avatar-svg" viewBox="0 0 40 40">
          ${hairPath}
          <circle cx="20" cy="22" r="10" fill="${skin}"/>
          <circle cx="17" cy="20" r="1.5" fill="#000"/>
          <circle cx="23" cy="20" r="1.5" fill="#000"/>
          <path d="M 17,25 Q 20,28 23,25" stroke="#000" stroke-width="1.5" fill="none"/>
        </svg>
      `;
    }

    function createCharacter() {
      const name = document.getElementById('newCharName').value.trim();
      if(!name) return alert('Enter a character name!');

      const char = {
        id: Date.now(),
        name: name,
        skin: document.getElementById('newCharSkin').value,
        hairStyle: document.getElementById('newCharHairStyle').value,
        hairColor: document.getElementById('newCharHairColor').value,
        streak: 0
      };

      characters.push(char);
      localStorage.setItem('sm_characters', JSON.stringify(characters));
      document.getElementById('newCharName').value = '';
      renderCharacterList();
    }

    function renderCharacterList() {
      const container = document.getElementById('characterList');
      container.innerHTML = characters.length === 0 ? '<div style="color:var(--text-gray); font-size:13px;">No characters added yet.</div>' : '';
      characters.forEach(c => {
        const div = document.createElement('div');
        div.style.cssText = 'display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:14px;';
        div.innerHTML = `${generateBitmojiSVG(c.skin, c.hairStyle, c.hairColor)} <b>${c.name}</b> 🔥 ${c.streak}`;
        container.appendChild(div);
      });
    }

    async function saveMedia() {
      const message = document.getElementById('msgInput').value.trim();
      const file = document.getElementById('fileInput').files[0];

      if (!message || !file) return alert('Please enter a message and choose a file!');

      // Pick a random character from the pool
      const randomChar = characters[Math.floor(Math.random() * characters.length)];

      const isVideo = file.type.startsWith('video');
      const transaction = db.transaction(["mediaPool"], "readwrite");
      const store = transaction.objectStore("mediaPool");

      store.add({
        characterId: randomChar.id,
        characterName: randomChar.name,
        message: message,
        type: isVideo ? 'video' : 'photo',
        fileData: file,
        opened: false,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      transaction.oncomplete = () => {
        closeModal('uploadModal');
        document.getElementById('msgInput').value = '';
        document.getElementById('fileInput').value = '';
        renderFeed();
      };
    }

    function renderFeed() {
      const feed = document.getElementById('snapFeed');
      feed.innerHTML = '';

      const transaction = db.transaction(["mediaPool"], "readonly");
      const store = transaction.objectStore("mediaPool");
      const req = store.getAll();

      req.onsuccess = () => {
        const items = req.result;
        if (items.length === 0) {
          feed.innerHTML = `<div style="text-align:center; padding: 60px 20px; color: var(--text-gray); font-size:14px;">Your chat feed is empty.<br>Tap <b>+ Add Snap</b> to upload content!</div>`;
          return;
        }

        items.forEach(item => {
          const char = characters.find(c => c.id === item.characterId) || { skin: '#FD3', hairStyle: 'short', hairColor: '#000', streak: 0 };
          const div = document.createElement('div');
          div.className = 'snap-item';
          const isPhoto = item.type === 'photo';
          
          div.innerHTML = `
            <div class="avatar-box">
              ${generateBitmojiSVG(char.skin, char.hairStyle, char.hairColor)}
              <div class="snap-type-badge ${item.opened ? 'opened' : (isPhoto ? 'photo' : 'video')}"></div>
            </div>
            <div class="snap-info">
              <div class="snap-header-line">
                <span class="snap-author">${item.characterName}</span>
                ${char.streak > 0 ? `<span class="streak-count">🔥 ${char.streak}</span>` : ''}
              </div>
              <div class="snap-sub">
                <span>${item.opened ? 'Opened' : `New ${isPhoto ? 'Snap' : 'Video'}`}</span> • <span>${item.timestamp}</span>
              </div>
            </div>
          `;

          div.onclick = () => handleSnapClick(item, char);
          feed.appendChild(div);
        });
      };
    }

    function handleSnapClick(item, char) {
      selectedSnap = item;
      selectedSnap.charData = char;
      if (item.opened) {
        openViewer(item, char);
      } else {
        document.getElementById('taskAvatarPreview').innerHTML = generateBitmojiSVG(char.skin, char.hairStyle, char.hairColor);
        document.getElementById('taskCharName').innerText = `Snap from ${item.characterName}`;
        openModal('taskModal');
      }
    }

    function confirmTaskAndOpen() {
      closeModal('taskModal');
      
      // Increment Character Streak
      const charIndex = characters.findIndex(c => c.id === selectedSnap.characterId);
      if(charIndex !== -1) {
        characters[charIndex].streak += 1;
        localStorage.setItem('sm_characters', JSON.stringify(characters));
      }

      // Update opened status in IndexedDB
      const transaction = db.transaction(["mediaPool"], "readwrite");
      const store = transaction.objectStore("mediaPool");
      selectedSnap.opened = true;
      delete selectedSnap.charData;
      store.put(selectedSnap);

      transaction.oncomplete = () => {
        renderFeed();
        openViewer(selectedSnap, characters[charIndex] || selectedSnap.charData);
      };
    }

    function openViewer(item, char) {
      const viewer = document.getElementById('mediaViewer');
      const container = document.getElementById('mediaContainer');
      const charElem = document.getElementById('viewerChar');
      const avatarElem = document.getElementById('viewerAvatar');
      const msgElem = document.getElementById('viewerMsg');
      const progressBar = document.getElementById('timerProgress');

      container.innerHTML = '';
      charElem.innerText = item.characterName;
      if(char) avatarElem.innerHTML = generateBitmojiSVG(char.skin, char.hairStyle, char.hairColor);
      msgElem.innerText = item.message;

      const fileUrl = URL.createObjectURL(item.fileData);

      if (item.type === 'photo') {
        const img = document.createElement('img');
        img.src = fileUrl;
        img.className = 'viewer-media';
        container.appendChild(img);
      } else {
        const video = document.createElement('video');
        video.src = fileUrl;
        video.className = 'viewer-media';
        video.autoplay = true;
        video.playsInline = true;
        container.appendChild(video);
      }

      viewer.style.display = 'flex';

      // Timer Animation
      progressBar.style.transition = 'none';
      progressBar.style.width = '100%';
      
      setTimeout(() => {
        progressBar.style.transition = 'width 10s linear';
        progressBar.style.width = '0%';
      }, 50);

      timerInterval = setTimeout(() => {
        closeViewer();
      }, 10000);
    }

    function closeViewer() {
      clearTimeout(timerInterval);
      document.getElementById('mediaViewer').style.display = 'none';
      document.getElementById('mediaContainer').innerHTML = '';
    }
  </script>
</body>
</html>
