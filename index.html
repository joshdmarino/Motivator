<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Regression" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Regression Matches</title>
  <link rel="manifest" id="manifestLink" />
  <style>
    :root {
      --bg: #0b0b0e;
      --card: #16161a;
      --accent: #e11d48;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #27272a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .top {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .top h1 { font-size: 16px; font-weight: 600; }
    .top-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 2px;
      min-width: 48px;
    }
    .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
    .view.active { display: flex; }

    #discoverView {
      padding: 8px 10px 12px;
      justify-content: space-between;
    }
    .card-stack {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .tinder-card {
      width: 100%;
      height: 100%;
      max-height: calc(100dvh - 180px);
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 36px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .tinder-photo {
      flex: 1;
      background: #0f0f12;
      position: relative;
      overflow: hidden;
      min-height: 400px;
    }
    .tinder-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tinder-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 42px 14px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
    }
    .tinder-name {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.15;
    }
    .tinder-name span {
      font-weight: 500;
      font-size: 20px;
      opacity: 0.9;
    }
    .tinder-bio {
      margin-top: 6px;
      font-size: 14.5px;
      color: #e4e4e7;
      line-height: 1.35;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .swipe-actions {
      display: flex;
      justify-content: center;
      gap: 32px;
      padding: 14px 0 6px;
    }
    .swipe-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swipe-btn.no { color: #f87171; border-color: #7f1d1d; }
    .swipe-btn.yes { color: #4ade80; border-color: #166534; }

    .scene-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .scene-header img {
      width: 42px; height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }
    .scene-header .name { font-weight: 600; font-size: 15px; }
    .scene-header .sub { font-size: 12px; color: var(--muted); }
    .scene-media {
      width: 100%;
      background: #0a0a0c;
      flex: 1;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scene-media img, .scene-media video {
      width: 100%;
      height: 100%;
      max-height: 70dvh;
      object-fit: contain;
      background: #000;
    }
    .scene-caption {
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.45;
      border-bottom: 1px solid var(--border);
    }
    .scene-actions { padding: 14px; }
    .primary-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary-btn:disabled { opacity: 0.45; cursor: default; }
    .secondary-btn {
      width: 100%;
      margin-top: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .progress {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    #dashView { padding: 12px 12px 28px; }
    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dash-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .dash-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #111;
      display: block;
    }
    .dash-card .info { padding: 9px 10px; }
    .dash-card .name { font-weight: 600; font-size: 13.5px; }
    .dash-card .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    .manage-box {
      margin-top: 20px;
      padding: 14px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .manage-box label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .manage-box select {
      width: 100%;
      background: #1a1a1f;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .manage-actions {
      display: flex;
      gap: 8px;
    }
    .manage-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1a1a1f;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }
    .manage-actions button.danger {
      color: #f87171;
      border-color: #7f1d1d;
    }

    #addView { padding: 12px 14px 40px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .field input[type="text"],
    .field input[type="number"],
    .field select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 15px;
    }
    .check-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .check-item input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }
    .media-list { margin: 6px 0 10px; }
    .media-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .small-btn {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1a1a1f;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .bottom-nav {
      display: flex;
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 5px 0 8px;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      padding: 7px 4px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span { display: block; font-size: 17px; margin-bottom: 1px; }

    .install-banner {
      display: none;
      background: #1a1a22;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .install-banner.show { display: block; }
    .install-banner button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      margin-left: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="install-banner" id="installBanner">
    Add to Home Screen for app-like use
    <button onclick="hideInstallBanner()">Got it</button>
  </div>

  <div class="top">
    <button class="top-btn" id="topLeftBtn" onclick="handleTopLeft()"></button>
    <h1 id="topTitle">Discover</h1>
    <button class="top-btn" id="topRightBtn" onclick="showAdd()">Add</button>
  </div>

  <div id="discoverView" class="view active">
    <div class="card-stack" id="cardStack">
      <div class="empty-state">
        No characters yet.<br><br>
        Tap <strong>Add</strong> to create one.
      </div>
    </div>
    <div class="swipe-actions" id="swipeActions" style="display:none;">
      <button class="swipe-btn no" onclick="swipe(false)">✕</button>
      <button class="swipe-btn yes" onclick="swipe(true)">♥</button>
    </div>
  </div>

  <div id="sceneView" class="view">
    <div class="scene-header">
      <img id="sceneAvatar" src="" alt="">
      <div>
        <div class="name" id="sceneName">—</div>
        <div class="sub" id="sceneSub">—</div>
      </div>
    </div>
    <div class="scene-media" id="sceneMedia"></div>
    <div class="scene-caption" id="sceneCaption"></div>
    <div class="scene-actions">
      <button class="primary-btn" id="unlockBtn" onclick="unlockNext()">Log Workout – Unlock Next</button>
      <button class="secondary-btn" onclick="showDiscover()">Back to Discover</button>
      <div class="progress" id="sceneProgress"></div>
    </div>
  </div>

  <div id="dashView" class="view">
    <div id="dashContent">
      <div class="empty-state">No matches yet.</div>
    </div>

    <div class="manage-box" id="manageBox" style="display:none;">
      <label>Manage a character</label>
      <select id="manageSelect" onchange="onManageSelect()">
        <option value="">Select someone…</option>
      </select>
      <div class="manage-actions" id="manageActions" style="display:none;">
        <button onclick="startEditFromManage()">Edit</button>
        <button class="danger" onclick="deleteFromManage()">Delete</button>
      </div>
    </div>

    <div style="padding: 16px 0 0; display:flex; gap:8px;">
      <button class="secondary-btn" style="margin:0;" onclick="exportData()">Export Backup</button>
      <button class="secondary-btn" style="margin:0;" onclick="document.getElementById('importFile').click()">Import Backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)" />
    </div>
  </div>

  <div id="addView" class="view">
    <div class="field">
      <label>Name</label>
      <input type="text" id="addName" />
    </div>
    <div class="field">
      <label>Age</label>
      <input type="number" id="addAge" min="1" max="99" />
    </div>

    <div class="field">
      <label>Hair (select all that apply)</label>
      <div class="check-grid" id="hairChecks"></div>
    </div>

    <div class="field">
      <label>Body type (select all that apply)</label>
      <div class="check-grid" id="bodyChecks"></div>
    </div>

    <div class="field">
      <label>Breast size</label>
      <select id="addBreasts">
        <option value="">—</option>
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
        <option value="very large">Very large</option>
      </select>
    </div>

    <div class="field">
      <label>Tattoos</label>
      <select id="addTattoos">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </div>

    <div class="field">
      <label>Piercings (select all that apply)</label>
      <div class="check-grid" id="piercingChecks"></div>
    </div>

    <div class="field">
      <label>Profile Photo</label>
      <input type="file" id="addProfile" accept="image/*" />
    </div>

    <div style="font-size:12.5px; color:var(--muted); margin:14px 0 6px;">Extra media (unlocked later)</div>
    <div class="media-list" id="addMediaList"></div>
    <button class="small-btn" onclick="addMediaField()">+ Add Photo or Video</button>

    <button class="primary-btn" style="margin-top:22px;" id="saveBtn" onclick="saveCharacter()">Save</button>
    <button class="secondary-btn" onclick="cancelEdit()">Cancel</button>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" id="navDiscover" onclick="showDiscover()">
      <span>♡</span>Discover
    </button>
    <button class="nav-item" id="navDash" onclick="showDash()">
      <span>■</span>Matches
    </button>
  </div>

  <script>
    const HAIR_OPTS = ["Black","Brown","Blonde","Red / Auburn","Gray / Silver","Dyed / Unnatural","Long","Medium","Short","Straight","Wavy","Curly"];
    const BODY_OPTS = ["Slim","Athletic / Toned","Average","Soft","Curvy","Thick","Plus-size / Chubby","Petite"];
    const PIERCING_OPTS = ["None","Small nose stud","Septum","Multiple ear","Industrial / cartilage","Eyebrow","Lip / labret","Tongue","Nipple","Navel","Other facial","Heavy / stretched"];

    let characters = [];
    let currentIndex = 0;
    let activeId = null;
    let tempMedia = [];
    let orderedPool = [];
    let db = null;
    let editingId = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("RegressionMatchesDB", 1);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains("characters")) {
            database.createObjectStore("characters", { keyPath: "id" });
          }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(db); };
        request.onerror = () => reject(request.error);
      });
    }

    function saveCharacters() {
      return new Promise((resolve, reject) => {
        if (!db) return reject("DB not ready");
        const tx = db.transaction("characters", "readwrite");
        const store = tx.objectStore("characters");
        store.clear();
        characters.forEach(c => store.put(c));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function loadCharacters() {
      return new Promise((resolve, reject) => {
        if (!db) return reject("DB not ready");
        const tx = db.transaction("characters", "readonly");
        const store = tx.objectStore("characters");
        const req = store.getAll();
        req.onsuccess = () => { characters = req.result || []; resolve(characters); };
        req.onerror = () => reject(req.error);
      });
    }

    function setupManifest() {
      const manifest = {
        name: "Regression Matches",
        short_name: "Regression",
        start_url: location.href,
        display: "standalone",
        background_color: "#0b0b0e",
        theme_color: "#0b0b0e",
        orientation: "portrait",
        icons: [{
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23e11d48' width='100' height='100' rx='20'/%3E%3Ctext y='68' x='50' text-anchor='middle' font-size='50' fill='white'%3E♥%3C/text%3E%3C/svg%3E",
          sizes: "any",
          type: "image/svg+xml"
        }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
      document.getElementById("manifestLink").href = URL.createObjectURL(blob);
    }

    function hideInstallBanner() {
      document.getElementById("installBanner").classList.remove("show");
      localStorage.setItem("hideInstallBanner", "1");
    }

    function randomTargetAge() {
      const r = Math.random();
      if (r < 0.28) return 0;
      if (r < 0.48) return 1;
      if (r < 0.63) return 2;
      if (r < 0.75) return 3;
      if (r < 0.84) return 4;
      if (r < 0.90) return 5;
      if (r < 0.94) return 6 + Math.floor(Math.random() * 4);
      if (r < 0.97) return 10 + Math.floor(Math.random() * 5);
      return 15 + Math.floor(Math.random() * 9);
    }

    function generateDesireLine() {
      const age = randomTargetAge();
      if (age === 0) return "Regression age: newborn";
      return "Regression age: " + age;
    }

    function computeDifficulty(c) {
      let d = 0.38;
      const hair = (c.hair || []).map(h => h.toLowerCase());
      const body = (c.body || []).map(b => b.toLowerCase());
      const piercings = (c.piercings || []).map(p => p.toLowerCase());
      const breasts = (c.breasts || "").toLowerCase();
      const tattoos = (c.tattoos || "no").toLowerCase();

      if (hair.some(h => h.includes("blonde"))) d -= 0.06;
      if (hair.some(h => h.includes("black") || h.includes("dark"))) d += 0.02;
      if (hair.some(h => h.includes("dyed") || h.includes("unnatural"))) d -= 0.04;

      if (body.some(b => b.includes("slim") || b.includes("athletic") || b.includes("toned"))) d -= 0.11;
      if (body.some(b => b.includes("curvy") || b.includes("thick"))) d += 0.05;
      if (body.some(b => b.includes("soft") || b.includes("plus") || b.includes("chubby"))) d += 0.09;
      if (body.some(b => b.includes("average"))) d += 0.03;
      if (body.some(b => b.includes("petite"))) d -= 0.03;

      if (breasts === "very large") d -= 0.05;
      if (breasts === "large") d -= 0.02;
      if (breasts === "small") d += 0.04;

      if (tattoos === "yes") d -= 0.07;

      if (piercings.includes("small nose stud") && piercings.length === 1) {
        d += 0.03;
      } else {
        if (piercings.includes("septum")) d -= 0.06;
        if (piercings.includes("industrial") || piercings.includes("cartilage")) d -= 0.05;
        if (piercings.includes("eyebrow")) d -= 0.05;
        if (piercings.includes("lip") || piercings.includes("labret")) d -= 0.07;
        if (piercings.includes("tongue")) d -= 0.08;
        if (piercings.includes("nipple")) d -= 0.04;
        if (piercings.includes("navel")) d -= 0.03;
        if (piercings.includes("other facial")) d -= 0.06;
        if (piercings.includes("heavy") || piercings.includes("stretched")) d -= 0.12;
        if (piercings.includes("multiple ear")) d -= 0.03;
        const nonNone = piercings.filter(p => p !== "none" && p !== "small nose stud");
        if (nonNone.length >= 3) d -= 0.08;
      }

      if (c.age >= 42) d += 0.05;
      if (c.age <= 24) d -= 0.06;

      return Math.max(0.07, Math.min(0.82, d));
    }

    function buildCheckGrid(containerId, options, namePrefix) {
      const el = document.getElementById(containerId);
      el.innerHTML = "";
      options.forEach(opt => {
        const id = namePrefix + "_" + opt.replace(/[^a-z0-9]/gi, "_");
        const label = document.createElement("label");
        label.className = "check-item";
        label.innerHTML = `<input type="checkbox" id="${id}" value="${opt}"> ${opt}`;
        el.appendChild(label);
      });
    }

    function getChecked(containerId) {
      const boxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
      return Array.from(boxes).map(b => b.value);
    }

    function setChecked(containerId, values) {
      document.querySelectorAll(`#${containerId} input[type="checkbox"]`).forEach(cb => {
        cb.checked = values && values.includes(cb.value);
      });
    }

    function hideAll() {
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    }

    function showDiscover() {
      hideAll();
      document.getElementById("discoverView").classList.add("active");
      document.getElementById("navDiscover").classList.add("active");
      document.getElementById("topTitle").textContent = "Discover";
      document.getElementById("topLeftBtn").textContent = "";
      document.getElementById("topRightBtn").textContent = "Add";
      editingId = null;
      buildWeightedPool();
      renderDiscover();
    }

    function showDash() {
      hideAll();
      document.getElementById("dashView").classList.add("active");
      document.getElementById("navDash").classList.add("active");
      document.getElementById("topTitle").textContent = "Matches";
      document.getElementById("topLeftBtn").textContent = "";
      document.getElementById("topRightBtn").textContent = "Add";
      renderDash();
    }

    function showAdd() {
      hideAll();
      document.getElementById("addView").classList.add("active");
      document.getElementById("topTitle").textContent = editingId ? "Edit" : "New";
      document.getElementById("topLeftBtn").textContent = "Cancel";
      document.getElementById("topRightBtn").textContent = "";
      document.getElementById("saveBtn").textContent = editingId ? "Update" : "Save";
      if (!editingId) {
        document.getElementById("addName").value = "";
        document.getElementById("addAge").value = "";
        document.getElementById("addBreasts").value = "";
        document.getElementById("addTattoos").value = "no";
        document.getElementById("addProfile").value = "";
        document.querySelectorAll("#hairChecks input, #bodyChecks input, #piercingChecks input").forEach(c => c.checked = false);
        tempMedia = [];
        renderTempMedia();
      }
    }

    function cancelEdit() {
      editingId = null;
      showDiscover();
    }

    function showScene(id) {
      activeId = id;
      hideAll();
      document.getElementById("sceneView").classList.add("active");
      document.getElementById("topTitle").textContent = "Scene";
      document.getElementById("topLeftBtn").textContent = "←";
      document.getElementById("topRightBtn").textContent = "";
      renderScene();
    }

    function handleTopLeft() {
      const title = document.getElementById("topTitle").textContent;
      if (title === "New" || title === "Edit" || title === "Scene") {
        editingId = null;
        showDiscover();
      }
    }

    function onManageSelect() {
      const val = document.getElementById("manageSelect").value;
      document.getElementById("manageActions").style.display = val ? "flex" : "none";
    }

    function startEditFromManage() {
      const id = document.getElementById("manageSelect").value;
      if (!id) return;
      const c = characters.find(x => x.id === id);
      if (!c) return;

      editingId = c.id;
      document.getElementById("addName").value = c.name;
      document.getElementById("addAge").value = c.age;
      document.getElementById("addBreasts").value = c.breasts || "";
      document.getElementById("addTattoos").value = c.tattoos || "no";
      setChecked("hairChecks", c.hair || []);
      setChecked("bodyChecks", c.body || []);
      setChecked("piercingChecks", c.piercings || []);
      tempMedia = (c.media || []).map(m => ({ ...m }));
      renderTempMedia();
      showAdd();
    }

    function deleteFromManage() {
      const id = document.getElementById("manageSelect").value;
      if (!id) return;
      const c = characters.find(x => x.id === id);
      if (!c) return;
      if (!confirm(`Delete ${c.name}? This cannot be undone.`)) return;

      characters = characters.filter(x => x.id !== id);
      saveCharacters().then(() => {
        document.getElementById("manageSelect").value = "";
        document.getElementById("manageActions").style.display = "none";
        renderDash();
        buildWeightedPool();
      });
    }

    function buildWeightedPool() {
      const unmatched = characters.filter(c => !c.matched);
      orderedPool = [];
      unmatched.forEach(c => {
        const chance = computeDifficulty(c);
        const weight = Math.max(1, Math.round((1 - chance) * 16));
        for (let i = 0; i < weight; i++) orderedPool.push(c);
      });
      for (let i = orderedPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [orderedPool[i], orderedPool[j]] = [orderedPool[j], orderedPool[i]];
      }
      currentIndex = 0;
    }

    function renderDiscover() {
      const stack = document.getElementById("cardStack");
      const actions = document.getElementById("swipeActions");

      if (orderedPool.length === 0) {
        stack.innerHTML = `<div class="empty-state">
          ${characters.length === 0 
            ? "No characters yet.<br><br>Tap <strong>Add</strong> to create one."
            : "No more new women right now."}
        </div>`;
        actions.style.display = "none";
        return;
      }

      if (currentIndex >= orderedPool.length) currentIndex = 0;
      const c = orderedPool[currentIndex];

      if (!c.desireLine) {
        c.desireLine = generateDesireLine();
        saveCharacters();
      }

      stack.innerHTML = `
        <div class="tinder-card">
          <div class="tinder-photo">
            ${c.profile 
              ? `<img src="${c.profile}" alt="">` 
              : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);">No photo</div>`}
            <div class="tinder-info">
              <div class="tinder-name">${escapeHtml(c.name)} <span>${c.age}</span></div>
              <div class="tinder-bio">${escapeHtml(c.desireLine)}</div>
            </div>
          </div>
        </div>`;
      actions.style.display = "flex";
    }

    function swipe(right) {
      if (orderedPool.length === 0) return;
      const c = orderedPool[currentIndex];

      if (right) {
        const chance = computeDifficulty(c);
        if (Math.random() > chance) {
          currentIndex = (currentIndex + 1) % orderedPool.length;
          renderDiscover();
          return;
        }
        c.matched = true;
        c.unlocked = 1;
        saveCharacters().then(() => showScene(c.id));
      } else {
        currentIndex = (currentIndex + 1) % orderedPool.length;
        renderDiscover();
      }
    }

    function renderScene() {
      const c = characters.find(x => x.id === activeId);
      if (!c) return;

      document.getElementById("sceneAvatar").src = c.profile || "";
      document.getElementById("sceneName").textContent = `${c.name}, ${c.age}`;
      document.getElementById("sceneSub").textContent = c.desireLine || "";

      const mediaEl = document.getElementById("sceneMedia");
      const captionEl = document.getElementById("sceneCaption");
      const progressEl = document.getElementById("sceneProgress");
      const unlockBtn = document.getElementById("unlockBtn");

      const idx = Math.max(0, (c.unlocked || 1) - 1);
      const item = c.media[idx];

      if (!item || !item.data) {
        mediaEl.innerHTML = `<div style="color:var(--muted);padding:40px;text-align:center;">No media.</div>`;
        captionEl.textContent = "";
        unlockBtn.style.display = "none";
        progressEl.textContent = "";
        return;
      }

      if (item.type === "video") {
        mediaEl.innerHTML = `<video src="${item.data}" controls playsinline></video>`;
      } else {
        mediaEl.innerHTML = `<img src="${item.data}" alt="">`;
      }
      captionEl.textContent = item.caption || "";

      const total = c.media.length;
      const unlocked = c.unlocked || 1;
      progressEl.textContent = `${unlocked} / ${total} unlocked`;

      if (unlocked >= total) {
        unlockBtn.textContent = "Fully Unlocked";
        unlockBtn.disabled = true;
      } else {
        unlockBtn.textContent = "Log Workout – Unlock Next";
        unlockBtn.disabled = false;
        unlockBtn.style.display = "block";
      }
    }

    function unlockNext() {
      const c = characters.find(x => x.id === activeId);
      if (!c || (c.unlocked || 1) >= c.media.length) return;
      c.unlocked = (c.unlocked || 1) + 1;
      saveCharacters().then(() => renderScene());
    }

    function renderDash() {
      const matched = characters.filter(c => c.matched);
      const container = document.getElementById("dashContent");
      const manageBox = document.getElementById("manageBox");
      const manageSelect = document.getElementById("manageSelect");

      // Show ALL characters in manage dropdown
      manageSelect.innerHTML = `<option value="">Select someone…</option>`;
      characters.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.matched 
          ? `${c.name}, ${c.age}` 
          : `${c.name}, ${c.age} (not matched)`;
        manageSelect.appendChild(opt);
      });
      document.getElementById("manageActions").style.display = "none";
      manageBox.style.display = characters.length > 0 ? "block" : "none";

      if (matched.length === 0) {
        container.innerHTML = `<div class="empty-state">No matches yet.</div>`;
        return;
      }

      container.innerHTML = `<div class="dash-grid"></div>`;
      const grid = container.querySelector(".dash-grid");

      matched.forEach(c => {
        const card = document.createElement("div");
        card.className = "dash-card";
        card.onclick = () => showScene(c.id);
        card.innerHTML = `
          ${c.profile ? `<img src="${c.profile}" alt="">` : `<div style="height:170px;background:#111;"></div>`}
          <div class="info">
            <div class="name">${escapeHtml(c.name)}, ${c.age}</div>
            <div class="sub">${c.unlocked || 1}/${c.media.length} unlocked</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function exportData() {
      const data = JSON.stringify(characters);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "regression-backup-" + new Date().toISOString().slice(0,10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error("Invalid");
          if (!confirm(`Import ${imported.length} characters? This replaces current data.`)) return;
          characters = imported;
          saveCharacters().then(() => {
            currentIndex = 0;
            showDash();
            alert("Import complete");
          });
        } catch (err) {
          alert("Could not import file");
        }
      };
      reader.readAsText(file);
    }

    function addMediaField() {
      tempMedia.push({ type: "image", data: null, caption: "" });
      renderTempMedia();
    }

    function renderTempMedia() {
      const list = document.getElementById("addMediaList");
      list.innerHTML = "";
      tempMedia.forEach((m, i) => {
        const div = document.createElement("div");
        div.className = "media-item";
        div.innerHTML = `
          <strong>Media ${i + 1}</strong>
          <input type="text" value="${m.caption || ""}" onchange="tempMedia[${i}].caption = this.value"
            style="width:100%;margin:6px 0;padding:8px;border-radius:6px;border:1px solid var(--border);background:#1a1a1f;color:var(--text);font-size:13px;" />
          <input type="file" accept="image/*,video/*" onchange="handleTempMedia(event, ${i})" />
        `;
        list.appendChild(div);
      });
    }

    function handleTempMedia(e, index) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        tempMedia[index].data = ev.target.result;
        tempMedia[index].type = file.type.startsWith("video") ? "video" : "image";
      };
      reader.readAsDataURL(file);
    }

    function saveCharacter() {
      const name = document.getElementById("addName").value.trim();
      const age = parseInt(document.getElementById("addAge").value) || 0;
      const hair = getChecked("hairChecks");
      const body = getChecked("bodyChecks");
      const breasts = document.getElementById("addBreasts").value;
      const tattoos = document.getElementById("addTattoos").value;
      const piercings = getChecked("piercingChecks");
      const profileInput = document.getElementById("addProfile");

      if (!name) { alert("Name required"); return; }

      const finish = (profileData) => {
        const media = tempMedia.filter(m => m.data).map(m => ({ type: m.type, data: m.data, caption: m.caption || "" }));
        if (media.length === 0 && profileData) {
          media.push({ type: "image", data: profileData, caption: "" });
        }

        if (editingId) {
          const idx = characters.findIndex(c => c.id === editingId);
          if (idx !== -1) {
            const old = characters[idx];
            characters[idx] = {
              ...old,
              name, age, hair, body, breasts, tattoos, piercings,
              profile: profileData || old.profile,
              media: media.length ? media : old.media
            };
          }
          editingId = null;
        } else {
          characters.push({
            id: "c" + Date.now(),
            name, age, hair, body, breasts, tattoos, piercings,
            desireLine: generateDesireLine(),
            profile: profileData,
            media: media.length ? media : [{ type: "image", data: profileData || null, caption: "" }],
            matched: false,
            unlocked: 0
          });
        }

        saveCharacters().then(() => {
          currentIndex = 0;
          showDiscover();
        });
      };

      if (profileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = ev => finish(ev.target.result);
        reader.readAsDataURL(profileInput.files[0]);
      } else {
        finish(null);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    buildCheckGrid("hairChecks", HAIR_OPTS, "hair");
    buildCheckGrid("bodyChecks", BODY_OPTS, "body");
    buildCheckGrid("piercingChecks", PIERCING_OPTS, "pierce");
    setupManifest();

    openDB()
      .then(() => loadCharacters())
      .then(() => {
        showDiscover();
        if (!localStorage.getItem("hideInstallBanner") && !window.matchMedia("(display-mode: standalone)").matches) {
          document.getElementById("installBanner").classList.add("show");
        }
      })
      .catch(err => {
        console.error(err);
        alert("Storage error. Try refreshing.");
      });
  </script>
</body>
</html>
